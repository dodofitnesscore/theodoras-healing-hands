<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>Theodora's Healing Hands</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f2f2f0;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.page{max-width:620px;margin:auto;min-height:100vh;background:#fff}.login{padding:24px}.box{margin:10vh auto 0;padding:25px;border:1px solid #ddd;border-radius:20px;background:#fff}.brand{font:28px Georgia,serif}.muted{color:#777;line-height:1.5}label{display:block;font-size:11px;font-weight:800;margin:12px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;background:#fff}button{border:0;border-radius:11px;padding:12px;font-weight:800}.primary{width:100%;margin-top:14px;background:#111;color:#fff}.msg{font-size:13px;color:#666;margin-top:12px}.head{background:#111;color:#fff;padding:24px 18px}.tabs{display:flex;gap:7px;padding:12px}.tabs button{flex:1;background:#eee}.tabs .on{background:#111;color:#fff}.bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 14px}.bar h2{font:21px Georgia,serif;margin:0}.nav{width:40px;background:#eee}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week{font-size:10px;color:#777;text-align:center}.grid{padding:0 14px}.day{height:52px;border:1px solid #ddd;border-radius:10px;padding:7px;position:relative}.sel{background:#111;color:#fff}.dot{position:absolute;bottom:5px;left:50%;width:5px;height:5px;border-radius:50%;background:#111}.sel .dot{background:#fff}.section{padding:15px 16px}.card,.client,.stat{border:1px solid #ddd;border-radius:14px;padding:12px;margin:8px 0}.card{display:flex;gap:10px}.body{flex:1}.name{font-weight:800}.meta{font-size:12px;color:#777;margin-top:4px}.price{font-weight:800}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.small{background:#eee;padding:7px 9px;font-size:11px}.done{opacity:.5}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}.stat{background:#f5f5f3;border:0}.stat span{font-size:11px;color:#777}.stat b{display:block;font-size:22px;margin-top:4px}.fab{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(580px,calc(100% - 28px));background:#111;color:#fff}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;z-index:10}.show{display:flex}.sheet{width:100%;max-width:620px;margin:auto;background:#fff;border-radius:20px 20px 0 0;padding:18px;max-height:94vh;overflow:auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btns{display:flex;gap:8px;margin-top:14px}.btns button{flex:1}.empty{text-align:center;color:#999;padding:25px}
</style></head><body><div id="root" class="page"></div>
<script>
const URL='https://sqwvyudsnsnkdvijqlbz.supabase.co',KEY='sb_publishable_dvB6YzXNN3_h2bPzilxKiA_Ww-q_Nor',client=supabase.createClient(URL,KEY);let user=null,A=[],C=[],cur=new Date(),sel=new Date(),view='calendar';
const MS=['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'],pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function loginUI(){root.innerHTML='<div class="login"><div class="box"><div class="brand">Theodora\'s Healing Hands</div><p class="muted">Σύνδεση στην online εφαρμογή ραντεβού και πελατολογίου.</p><label>Email</label><input id="email" type="email" autocomplete="email"><label>Κωδικός</label><input id="pass" type="password" autocomplete="current-password"><button id="loginBtn" class="primary">Σύνδεση</button><div id="msg" class="msg"></div></div></div>';document.getElementById('loginBtn').onclick=doLogin}
async function doLogin(){const e=email.value.trim(),p=pass.value.trim(),m=msg;if(!e||!p){m.textContent='Συμπλήρωσε email και κωδικό.';return}m.textContent='Σύνδεση...';try{const r=await client.auth.signInWithPassword({email:e,password:p});if(r.error){m.textContent=r.error.message;return}user=r.data.user;await load();}catch(x){m.textContent=x.message||'Σφάλμα σύνδεσης.'}}
async function load(){const [cr,ar]=await Promise.all([client.from('clients').select('*').order('name'),client.from('appointments').select('*').order('date').order('time')]);if(cr.error||ar.error){root.innerHTML='<div class="login"><div class="box"><div class="brand">Theodora\'s Healing Hands</div><p class="msg">'+esc(cr.error?.message||ar.error?.message||'Σφάλμα φόρτωσης.')+'</p></div></div>';return}C=cr.data||[];A=ar.data||[];appUI()}
function appUI(){root.innerHTML='<div class="head"><div class="brand" style="color:#fff">Theodora\'s Healing Hands</div><div style="font-size:11px;opacity:.7;margin-top:4px">Ημερολόγιο • Πελάτες • Έσοδα</div></div><div class="tabs"><button id="tc" class="on">Ημερολόγιο</button><button id="tp">Πελάτες</button><button id="ti">Έσοδα</button></div><div id="content"></div><button id="fab" class="fab">＋ Νέο Ραντεβού</button><div id="modal" class="modal"></div>';tc.onclick=()=>{view='calendar';render()};tp.onclick=()=>{view='clients';render()};ti.onclick=()=>{view='income';render()};fab.onclick=()=>openForm();render()}
function render(){tc.classList.toggle('on',view==='calendar');tp.classList.toggle('on',view==='clients');ti.classList.toggle('on',view==='income');if(view==='calendar')calendar();if(view==='clients')clients();if(view==='income')income()}
function calendar(){let h='<div class="bar"><button class="nav" onclick="move(-1)">‹</button><h2>'+MS[cur.getMonth()]+' '+cur.getFullYear()+'</h2><button class="nav" onclick="move(1)">›</button></div><div class="week"><span>ΔΕ</span><span>ΤΡ</span><span>ΤΕ</span><span>ΠΕ</span><span>ΠΑ</span><span>ΣΑ</span><span>ΚΥ</span></div><div class="grid">',f=new Date(cur.getFullYear(),cur.getMonth(),1),st=(f.getDay()+6)%7,n=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();for(let i=0;i<st;i++)h+='<div></div>';for(let d=1;d<=n;d++){let k=cur.getFullYear()+'-'+pad(cur.getMonth()+1)+'-'+pad(d);h+='<div class="'+(k===iso(sel)?'day sel':'day')+'" onclick="pick('+d+')">'+d+(A.some(a=>a.date===k&&a.status!=='cancelled')?'<i class="dot"></i>':'')+'</div>'}h+='</div><div class="section"><h3>'+sel.toLocaleDateString('el-GR',{weekday:'long',day:'numeric',month:'long'})+'</h3>';let z=A.filter(a=>a.date===iso(sel)).sort((a,b)=>a.time.localeCompare(b.time));h+=z.length?z.map(card).join(''):'<div class="empty">Δεν υπάρχουν ραντεβού.</div>';content.innerHTML=h+'</div>'}
function card(a){const c=C.find(x=>x.id===a.client_id);return '<div class="card '+(a.status==='completed'?'done':'')+'"><div><b>'+a.time+'</b></div><div class="body"><div class="name">'+esc(c?.name||'Πελάτης')+'</div><div class="meta">'+esc(a.service)+' · '+esc(a.location||'')+' · '+esc(a.payment||'')+'</div><div class="actions"><button class="small" onclick="openForm(\''+a.id+'\')">Επεξεργασία</button><button class="small" onclick="toggleDone(\''+a.id+'\')">'+(a.status==='completed'?'↩ Ανοιχτό':'✓ Ολοκληρώθηκε')+'</button><button class="small" onclick="removeA(\''+a.id+'\')">Διαγραφή</button></div></div><div class="price">'+Number(a.price||0).toFixed(2)+'€</div></div>'}
function clients(){let q=(document.getElementById('clientSearch')?.value||'').toLowerCase();content.innerHTML='<div class="section"><input id="clientSearch" placeholder="Αναζήτηση πελάτη..." value="'+esc(q)+'" oninput="clients()"></div>'+C.filter(c=>c.name.toLowerCase().includes(q)||(c.phone||'').includes(q)).map(c=>'<div class="client"><b>'+esc(c.name)+'</b><div class="meta">'+esc(c.phone||'Χωρίς τηλέφωνο')+'</div><div class="meta">Ραντεβού: '+A.filter(a=>a.client_id===c.id).length+'</div></div>').join('')||'<div class="empty">Δεν βρέθηκαν πελάτες.</div>'}
function income(){let ym=cur.getFullYear()+'-'+pad(cur.getMonth()+1),d=A.filter(a=>a.date.startsWith(ym)&&a.status==='completed'),sum=d.reduce((s,a)=>s+Number(a.price||0),0);content.innerHTML='<div class="bar"><button class="nav" onclick="move(-1)">‹</button><h2>'+MS[cur.getMonth()]+' '+cur.getFullYear()+'</h2><button class="nav" onclick="move(1)">›</button></div><div class="stats"><div class="stat"><span>Έσοδα</span><b>'+sum.toFixed(2)+'€</b></div><div class="stat"><span>Ολοκληρωμένα</span><b>'+d.length+'</b></div></div><div class="section">'+(d.map(a=>'<div class="card"><div>'+a.date.slice(8)+'<br>'+a.time+'</div><div class="body"><b>'+esc((C.find(c=>c.id===a.client_id)||{}).name||'Πελάτης')+'</b><div class="meta">'+esc(a.service)+'</div></div><div class="price">'+Number(a.price||0).toFixed(2)+'€</div></div>').join('')||'<div class="empty">Δεν υπάρχουν ολοκληρωμένα ραντεβού.</div>')+'</div>'}
function pick(d){sel=new Date(cur.getFullYear(),cur.getMonth(),d);render()}function move(n){cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);sel=new Date(cur);render()}
function openForm(id){const a=id?A.find(x=>x.id===id):null,c=a?C.find(x=>x.id===a.client_id):null;modal.innerHTML='<div class="sheet"><h2>'+(a?'Επεξεργασία':'Νέο')+' Ραντεβού</h2><label>Όνομα</label><input id="fn" value="'+esc(c?.name||'')+'"><label>Τηλέφωνο</label><input id="fp" value="'+esc(c?.phone||'')+'"><div class="row"><div><label>Ημερομηνία</label><input id="fd" type="date" value="'+(a?.date||iso(sel))+'"></div><div><label>Ώρα</label><input id="ft" type="time" value="'+(a?.time||'')+'"></div></div><div class="row"><div><label>Μασάζ</label><select id="fs"><option>30 min Massage</option><option selected>60 min Massage</option><option>90 min Massage</option></select></div><div><label>Τοποθεσία</label><select id="fl"><option>Κατ οίκον</option><option>Studio</option><option>Ξενοδοχείο</option></select></div></div><div class="row"><div><label>Ποσό (€)</label><input id="fprice" type="number" step=".01"></div><div><label>Πληρωμή</label><select id="fpay"><option>Μετρητά</option><option>POS</option><option>Κατάθεση</option><option>Εκκρεμεί</option></select></div></div><label>Σημειώσεις</label><textarea id="fnote" rows="3"></textarea><div class="btns"><button onclick="closeForm()">Άκυρο</button><button class="primary" onclick="saveForm(\''+(a?.id||'')+'\')">Αποθήκευση</button></div></div>';if(a){fs.value=a.service||'60 min Massage';fl.value=a.location||'Κατ οίκον';fprice.value=a.price||'';fpay.value=a.payment||'Μετρητά';fnote.value=a.notes||''}modal.classList.add('show')}
function closeForm(){modal.classList.remove('show')}
async function saveForm(id){try{const name=fn.value.trim();if(!name||!fd.value||!ft.value){alert('Συμπλήρωσε όνομα, ημερομηνία και ώρα.');return}let c=C.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!c){const r=await client.from('clients').insert({user_id:user.id,name,phone:fp.value.trim()}).select().single();if(r.error)throw r.error;c=r.data;C.push(c)}else await client.from('clients').update({phone:fp.value.trim()}).eq('id',c.id);const row={user_id:user.id,client_id:c.id,date:fd.value,time:ft.value,service:fs.value,duration_minutes:parseInt(fs.value)||60,location:fl.value,price:Number(fprice.value||0),payment:fpay.value,notes:fnote.value.trim()};const r=id?await client.from('appointments').update(row).eq('id',id):await client.from('appointments').insert(row);if(r.error)throw r.error;closeForm();await load()}catch(x){alert(x.message||'Δεν αποθηκεύτηκε.')}}
async function toggleDone(id){const a=A.find(x=>x.id===id),r=await client.from('appointments').update({status:a.status==='completed'?'scheduled':'completed'}).eq('id',id);if(r.error)alert(r.error.message);else await load()}
async function removeA(id){if(confirm('Να διαγραφεί το ραντεβού;')){const r=await client.from('appointments').delete().eq('id',id);if(r.error)alert(r.error.message);else await load()}}
(async()=>{const s=await client.auth.getSession();if(s.data.session){user=s.data.session.user;await load()}else loginUI()})();
</script></body></html>
