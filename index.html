 h+='</div><div class="section"><h3>'+selected.toLocaleDateString('el-GR',{weekday:'long',day:'numeric',month:'long'})+'</h3>';
 const arr=appointments.filter(a=>a.date===iso(selected)).sort((a,b)=>a.time.localeCompare(b.time));h+=arr.length?arr.map(card).join(''):'<div class="empty">Δεν υπάρχουν ραντεβού.</div>';document.getElementById('content').innerHTML=h+'</div>';

 document.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{selected=new Date(cursor.getFullYear(),cursor.getMonth(),Number(el.dataset.day));calendar()});
}

const VAPID_PUBLIC_KEY='BEndZkHj2vMFmEpdU8Cyo3kp2Z_1jKyrnc2PCtIrcxQms28OzE3IPm_6BVZaupbpEQVo1fvdXRQkqUeHGxraH8A';
function urlBase64ToUint8Array(base64String){const padding='='.repeat((4-base64String.length%4)%4),base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(base64);return Uint8Array.from([...raw].map(ch=>ch.charCodeAt(0)))}
async function registerServiceWorker(){if(!('serviceWorker' in navigator))throw new Error('Το Web Push δεν υποστηρίζεται εδώ.');return await navigator.serviceWorker.register('./sw.js')}
async function enableWebPush(){
 if(!('Notification' in window)||!('serviceWorker' in navigator)||!('PushManager' in window)){throw new Error('Άνοιξε την εφαρμογή από το εικονίδιο στην Αρχική οθόνη του iPhone.')}
 const p=await Notification.requestPermission(); if(p!=='granted')throw new Error('Οι ειδοποιήσεις δεν ενεργοποιήθηκαν.');
 const reg=await registerServiceWorker();
 let sub=await reg.pushManager.getSubscription();
 if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});
 const sj=sub.toJSON();
 const rr=await fetch(SUPA+'/functions/v1/register-push',{method:'POST',headers:{'apikey':APIKEY,'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({subscription:sj,reminder_minutes:reminderMinutes()})});
 if(!rr.ok){const j=await rr.json().catch(()=>({}));throw new Error(j.error||j.message||'Δεν έγινε η σύνδεση Web Push.')}
 localStorage.setItem('thh_reminders_enabled','1');localStorage.setItem('thh_push_enabled','1');
}

function clientName(id){return ((clients.find(function(c){return c.id===id})||{}).name)||'Πελάτης'}
function upcomingAppointments(){
 const now=new Date();
 const horizon=new Date(now.getTime()+7*24*60*60*1000);
 return appointments.filter(function(a){
  if(a.status==='completed'||a.status==='cancelled')return false;
  const dt=new Date(a.date+'T'+a.time);
  return dt>=now&&dt<=horizon;
 }).sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time)});
}

function checkDueReminders(){
 if(!reminderEnabled()||!('Notification' in window)||Notification.permission!=='granted')return;
 const now=Date.now(),mins=reminderMinutes(),fired=JSON.parse(localStorage.getItem('thh_fired_reminders')||'{}');
 appointments.forEach(function(a){
  if(a.status==='completed'||a.status==='cancelled')return;
  const ts=new Date(a.date+'T'+a.time).getTime(), key=a.id+'_'+mins;
  if(now>=ts-mins*60000&&now<ts-mins*60000+90000&&!fired[key]){
   try{new Notification('Ραντεβού σε '+(mins>=60?(mins/60)+' ώρα':'30 λεπτά'),{body:clientName(a.client_id)+' • '+a.time+' • '+(a.service||'Μασάζ')});fired[key]=true;localStorage.setItem('thh_fired_reminders',JSON.stringify(fired))}catch(e){}
  }
 });
}

function renderIncome(){
 const content=document.getElementById('content');
 let selectedPeriod='month';
 function periodData(period){
  const now=new Date(cursor);
  const y=now.getFullYear(),m=now.getMonth(),day=now.getDate();
  let arr=[];
  if(period==='day'){
   const k=iso(now);
   arr=appointments.filter(function(a){return a.date===k});
  }else if(period==='week'){
   const base=new Date(now);const dow=(base.getDay()+6)%7;
   const monday=new Date(base);monday.setDate(day-dow);monday.setHours(0,0,0,0);
   const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);sunday.setHours(23,59,59,999);
   arr=appointments.filter(function(a){const d=new Date(a.date+'T12:00:00');return d>=monday&&d<=sunday});
  }else{
   const ym=y+'-'+String(m+1).padStart(2,'0');
   arr=appointments.filter(function(a){return a.date.startsWith(ym)});
  }
  const done=arr.filter(function(a){return a.status==='completed'});
  const pending=arr.filter(function(a){return a.status!=='completed'&&a.status!=='cancelled'});
  const revenue=done.reduce(function(s,a){return s+Number(a.price||0)},0);
  return {arr:arr,done:done,pending:pending,revenue:revenue};
 }
 function title(period){
  const now=new Date(cursor);
  if(period==='day')return now.toLocaleDateString('el-GR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  if(period==='week'){
   const dow=(now.getDay()+6)%7,monday=new Date(now);monday.setDate(now.getDate()-dow);
   const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);
   return monday.toLocaleDateString('el-GR',{day:'numeric',month:'short'})+' – '+sunday.toLocaleDateString('el-GR',{day:'numeric',month:'short',year:'numeric'});
  }
  return ['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'][now.getMonth()]+' '+now.getFullYear();
 }
 function draw(){
  const p=periodData(selectedPeriod);
  content.innerHTML='<div class="bar"><button class="nav" id="prevStat">‹</button><h2>'+title(selectedPeriod)+'</h2><button class="nav" id="nextStat">›</button></div><div class="tabs" style="padding-top:0"><button id="dayStat" class="'+(selectedPeriod==='day'?'on':'')+'">Ημέρα</button><button id="weekStat" class="'+(selectedPeriod==='week'?'on':'')+'">Εβδομάδα</button><button id="monthStat" class="'+(selectedPeriod==='month'?'on':'')+'">Μήνας</button></div><div class="stats"><div class="stat"><span>Έσοδα</span><b>'+p.revenue.toFixed(2)+'€</b></div><div class="stat"><span>Ραντεβού</span><b>'+p.arr.length+'</b></div><div class="stat"><span>Ολοκληρωμένα</span><b>'+p.done.length+'</b></div><div class="stat"><span>Προγραμματισμένα</span><b>'+p.pending.length+'</b></div></div><div class="section"><h3>Ραντεβού περιόδου</h3>'+(p.arr.length?p.arr.slice().sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time)}).map(function(a){return '<div class="card '+(a.status==='completed'?'done':'')+'"><div><b>'+esc(a.date)+'</b><br>'+esc(a.time)+'</div><div class="body"><div class="name">'+esc((clients.find(function(c){return c.id===a.client_id})||{}).name||'Πελάτης')+'</div><div class="meta">'+esc(a.service||'')+' · '+esc(a.location||'')+' · '+(a.status==='completed'?'Ολοκληρώθηκε':a.status==='cancelled'?'Ακυρώθηκε':'Προγραμματισμένο')+'</div></div><div class="price">'+Number(a.price||0).toFixed(2)+'€</div></div>'}).join(''):'<div class="empty">Δεν υπάρχουν ραντεβού για αυτή την περίοδο.</div>')+'</div>';
  document.getElementById('prevStat').onclick=function(){if(selectedPeriod==='month')cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);else if(selectedPeriod==='week')cursor=new Date(cursor.getFullYear(),cursor.getMonth(),cursor.getDate()-7);else cursor=new Date(cursor.getFullYear(),cursor.getMonth(),cursor.getDate()-1);draw()};
  document.getElementById('nextStat').onclick=function(){if(selectedPeriod==='month')cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);else if(selectedPeriod==='week')cursor=new Date(cursor.getFullYear(),cursor.getMonth(),cursor.getDate()+7);else cursor=new Date(cursor.getFullYear(),cursor.getMonth(),cursor.getDate()+1);draw()};
  document.getElementById('dayStat').onclick=function(){selectedPeriod='day';draw()};
  document.getElementById('weekStat').onclick=function(){selectedPeriod='week';draw()};
  document.getElementById('monthStat').onclick=function(){selectedPeriod='month';draw()};
 }
 draw();
}

function openForm(id){let a=id?appointments.find(x=>x.id===id):null,c=a?clients.find(x=>x.id===a.client_id):null;const m=document.getElementById('modal');m.innerHTML='<div class="sheet"><h2>'+(a?'Επεξεργασία':'Νέο')+' Ραντεβού</h2><label class="label">Όνομα</label><div class="autocomplete"><input class="input" id="fn" autocomplete="off" placeholder="Γράψε όνομα πελάτη..." value="'+esc(c?.name||'')+'"><div class="suggestions" id="clientSuggestions" hidden></div></div><label class="label">Τηλέφωνο</label><input class="input" id="fp" value="'+esc(c?.phone||'')+'"><div class="row"><div><label class="label">Ημερομηνία</label><input class="input" id="fd" type="date" value="'+(a?.date||iso(selected))+'"></div><div><label class="label">Ώρα</label><input class="input" id="ft" type="time" value="'+(a?.time||'')+'"></div></div><div class="row"><div><label class="label">Μασάζ</label><select class="input" id="fs"><option>30 min Massage</option><option>60 min Massage</option><option>90 min Massage</option></select></div><div><label class="label">Τοποθεσία</label><select class="input" id="fl"><option>Κατ οίκον</option><option>Studio</option><option>Ξενοδοχείο</option></select></div></div><div class="row"><div><label class="label">Ποσό (€)</label><input class="input" id="fprice" type="number" step=".01"></div><div><label class="label">Πληρωμή</label><select class="input" id="fpay"><option>Μετρητά</option><option>POS</option><option>Κατάθεση</option><option>Εκκρεμεί</option></select></div></div><label class="label">Σημειώσεις</label><textarea class="input" id="fnote" rows="3"></textarea><div class="btns"><button class="secondary" id="close">Άκυρο</button><button class="primary" id="save">Αποθήκευση</button></div></div>';if(a){document.getElementById('fs').value=a.service||'60 min Massage';document.getElementById('fl').value=a.location||'Κατ οίκον';document.getElementById('fprice').value=a.price||'';document.getElementById('fpay').value=a.payment||'Μετρητά';document.getElementById('fnote').value=a.notes||''}m.classList.add('show');
const nameInput=document.getElementById('fn'), phoneInput=document.getElementById('fp'), suggestionBox=document.getElementById('clientSuggestions');
function updateClientSuggestions(){
 const q=nameInput.value.trim().toLocaleLowerCase('el-GR');
 if(!q){suggestionBox.hidden=true;suggestionBox.innerHTML='';return}
 const matches=clients.filter(x=>(x.name||'').toLocaleLowerCase('el-GR').includes(q)).slice(0,8);
 if(!matches.length){suggestionBox.innerHTML='<div class="suggestion" style="color:#777">Δεν βρέθηκε πελάτης — μπορείς να συνεχίσεις με νέο όνομα.</div>';suggestionBox.hidden=false;return}
 suggestionBox.innerHTML=matches.map(x=>'<button type="button" class="suggestion" data-client-id="'+esc(x.id)+'">'+esc(x.name)+'<small>'+esc(x.phone||'Χωρίς τηλέφωνο')+'</small></button>').join('');
 suggestionBox.hidden=false;
 suggestionBox.querySelectorAll('[data-client-id]').forEach(btn=>btn.onclick=function(){
  const selectedClient=clients.find(x=>x.id===this.dataset.clientId);if(!selectedClient)return;
  nameInput.value=selectedClient.name;phoneInput.value=selectedClient.phone||'';
  suggestionBox.hidden=true;suggestionBox.innerHTML='';
 });
}
nameInput.addEventListener('input',updateClientSuggestions);
nameInput.addEventListener('focus',updateClientSuggestions);
document.getElementById('close').onclick=()=>m.classList.remove('show');
document.getElementById('save').onclick=()=>saveAppointment(id);
}
async function saveAppointment(id){try{let name=document.getElementById('fn').value.trim();if(!name||!document.getElementById('fd').value||!document.getElementById('ft').value)return alert('Συμπλήρωσε όνομα, ημερομηνία και ώρα.');let c=clients.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!c){let r=await api('/rest/v1/clients',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({user_id:userId,name,phone:document.getElementById('fp').value.trim()})});c=r[0];clients.push(c)}let row={user_id:userId,client_id:c.id,date:document.getElementById('fd').value,time:document.getElementById('ft').value,service:document.getElementById('fs').value,duration_minutes:parseInt(document.getElementById('fs').value)||60,location:document.getElementById('fl').value,price:Number(document.getElementById('fprice').value||0),payment:document.getElementById('fpay').value,notes:document.getElementById('fnote').value.trim()};if(id)await api('/rest/v1/appointments?id=eq.'+id,{method:'PATCH',body:JSON.stringify(row)});else await api('/rest/v1/appointments',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(row)});document.getElementById('modal').classList.remove('show');await loadData()}catch(e){alert(e.message)}}
async function toggleDone(id){let a=appointments.find(x=>x.id===id),r=await api('/rest/v1/appointments?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:a.status==='completed'?'scheduled':'completed'})});await loadData()}
async function removeAppt(id){if(confirm('Να διαγραφεί το ραντεβού;')){await api('/rest/v1/appointments?id=eq.'+id,{method:'DELETE'});await loadData()}}
window.addEventListener('load',async function(){
 const token=localStorage.getItem('thh_access');
 if(!token)return;
 accessToken=token;
 try{
  const payload=JSON.parse(atob(token.split('.')[1]));
  userId=payload.sub||'';
  if(!userId)throw new Error('invalid session');
  await loadData();
 }catch(e){
  localStorage.removeItem('thh_access');
 }
});
