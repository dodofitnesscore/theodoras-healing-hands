    const r=await fetch('https://sqwvyudsnsnkdvijqlbz.supabase.co/auth/v1/signup',{

<script>
const URL='https://sqwvyudsnsnkdvijqlbz.supabase.co',KEY='sb_publishable_dvB6YzXNN3_h2bPzilxKiA_Ww-q_Nor',sb=supabase.createClient(URL,KEY);
const K='thh_v2_appointments';let session=null,appointments=[],clients=[],cur=new Date(),sel=new Date();
const MS=['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'];
const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function signIn(){const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value,msg=document.getElementById('loginMsg');if(!e||!p){msg.textContent='Συμπλήρωσε email και κωδικό.';return}msg.textContent='Σύνδεση...';try{const r=await sb.auth.signInWithPassword({email:e,password:p});msg.textContent=r.error?r.error.message:''}catch(err){msg.textContent='Παρουσιάστηκε σφάλμα σύνδεσης.'}}
async function signUp(){const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value,msg=document.getElementById('loginMsg');if(!e||!p){msg.textContent='Συμπλήρωσε email και κωδικό.';return}if(p.length<6){msg.textContent='Ο κωδικός πρέπει να έχει τουλάχιστον 6 χαρακτήρες.';return}msg.textContent='Δημιουργία λογαριασμού...';try{const r=await sb.auth.signUp({email:e,password:p});msg.textContent=r.error?r.error.message:(r.data.session?'Ο λογαριασμός δημιουργήθηκε.':'Έλεγξε το email σου για επιβεβαίωση και μετά συνδέσου.')}catch(err){msg.textContent='Παρουσιάστηκε σφάλμα. Δοκίμασε ξανά.'}}
async function logout(){await sb.auth.signOut()}
sb.auth.onAuthStateChange(async(_e,s)=>{session=s;document.getElementById('loginView').style.display=s?'none':'flex';document.getElementById('app').style.display=s?'block':'none';if(s){document.getElementById('userLabel').textContent=s.user.email||'';await loadCloud()}});
async function loadCloud(){let [cr,ar]=await Promise.all([sb.from('clients').select('*').order('name'),sb.from('appointments').select('*').order('date').order('time')]);if(cr.error||ar.error){alert('Δεν ήταν δυνατή η φόρτωση των online δεδομένων.');return}clients=cr.data||[];appointments=ar.data||[];await migrateLocal();render()}
async function migrateLocal(){let raw=localStorage.getItem(K);if(!raw)return;let local=JSON.parse(raw||'[]');if(!local.length)return;for(const a of local){let q=await sb.from('clients').select('*').eq('name',a.name).maybeSingle();let client=q.data;if(!client){let ins=await sb.from('clients').insert({user_id:session.user.id,name:a.name,notes:''}).select().single();if(ins.error)continue;client=ins.data}await sb.from('appointments').insert({user_id:session.user.id,client_id:client.id,date:a.date,time:a.time,service:a.service,duration_minutes:parseInt(a.service)||60,location:a.loc||a.location||'Κατ\' οίκον',price:Number(a.price||0),payment:a.pay||a.payment||'Εκκρεμεί',status:a.done?'completed':'scheduled',notes:a.notes||''})}localStorage.removeItem(K);let r=await sb.from('appointments').select('*').order('date').order('time');appointments=r.data||[];let c=await sb.from('clients').select('*').order('name');clients=c.data||[]}
function render(){renderCalendar();renderIncome();renderClients()}
function renderCalendar(){month.textContent=MS[cur.getMonth()]+' '+cur.getFullYear();month2.textContent=month.textContent;let f=new Date(cur.getFullYear(),cur.getMonth(),1),st=(f.getDay()+6)%7,N=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate(),h='';for(let j=0;j<st;j++)h+='<div></div>';for(let j=1;j<=N;j++){let k=cur.getFullYear()+'-'+pad(cur.getMonth()+1)+'-'+pad(j),cl='day'+(k==iso(sel)?' sel':'')+(k==iso(new Date())?' today':'');h+=`<div class="${cl}" onclick="pick(${j})">${j}${appointments.some(a=>a.date==k&&a.status!='cancelled')?'<i class="dot"></i>':''}</div>`}grid.innerHTML=h;let z=appointments.filter(a=>a.date==iso(sel)).sort((a,b)=>a.time.localeCompare(b.time));dateTitle.textContent=sel.toLocaleDateString('el-GR',{weekday:'long',day:'numeric',month:'long'});list.innerHTML=z.length?z.map(card).join(''):'<div class="empty">Δεν υπάρχουν ραντεβού.</div>'}
function card(a){let cl=clients.find(c=>c.id==a.client_id);return `<div class="card ${a.status=='completed'?'done':''}"><div><b>${a.time}</b></div><div class="body"><div class="name">${esc(cl?.name||'Πελάτης')}</div><div class="meta">${esc(a.service)} · ${esc(a.location||'')} · ${esc(a.payment||'')}</div>${a.notes?'<div class="meta">'+esc(a.notes)+'</div>':''}<div class="actions"><button class="small" onclick="openForm('${a.id}')">Επεξεργασία</button><button class="small" onclick="toggleDone('${a.id}')">${a.status=='completed'?'↩ Ανοιχτό':'✓ Ολοκληρώθηκε'}</button><button class="small danger" onclick="deleteAppointment('${a.id}')">Διαγραφή</button></div></div><div class="price">${Number(a.price||0).toFixed(2)}€</div></div>`}
function renderClients(){let q=(clientSearch.value||'').trim().toLowerCase(),arr=clients.filter(c=>c.name.toLowerCase().includes(q)||(c.phone||'').includes(q));clientsList.innerHTML=arr.length?arr.map(c=>{let hist=appointments.filter(a=>a.client_id==c.id),done=hist.filter(a=>a.status=='completed'),spent=done.reduce((s,a)=>s+Number(a.price||0),0);return `<div class="client" onclick="showHistory('${c.id}')"><div class="clientTop"><div><div class="clientName">${esc(c.name)}</div><div class="meta">${esc(c.phone||'Χωρίς τηλέφωνο')}</div></div><div style="text-align:right"><b>${hist.length}</b><div class="meta">ραντεβού</div></div></div><div class="meta">Σύνολο ολοκληρωμένων: ${spent.toFixed(2)}€</div></div>`}).join(''):'<div class="empty">Δεν βρέθηκαν πελάτες.</div>'}
function renderIncome(){let ym=cur.getFullYear()+'-'+pad(cur.getMonth()+1),all=appointments.filter(a=>a.date.startsWith(ym)),done=all.filter(a=>a.status=='completed');sum.textContent=done.reduce((s,a)=>s+Number(a.price||0),0).toFixed(2)+'€';cnt.textContent=done.length;income.innerHTML=all.length?all.map(a=>{let c=clients.find(x=>x.id==a.client_id);return `<div class="card ${a.status=='completed'?'':'done'}"><div>${a.date.slice(8)}<br>${a.time}</div><div class="body"><div class="name">${esc(c?.name||'Πελάτης')}</div><div class="meta">${esc(a.service)} · ${esc(a.location||'')} · ${a.status=='completed'?'Ολοκληρώθηκε':'Προγραμματισμένο'}</div></div><div class="price">${Number(a.price||0).toFixed(2)}€</div></div>`}).join(''):'<div class="empty">Δεν υπάρχουν ραντεβού.</div>'}
function tab(v){calTab.style.display=v=='cal'?'block':'none';clientsTab.style.display=v=='clients'?'block':'none';incTab.style.display=v=='inc'?'block':'none';tbCal.classList.toggle('on',v=='cal');tbClients.classList.toggle('on',v=='clients');tbInc.classList.toggle('on',v=='inc');render()}
function pick(j){sel=new Date(cur.getFullYear(),cur.getMonth(),j);renderCalendar()}function move(n){cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);sel=new Date(cur);render()}
function openForm(id){let a=id?appointments.find(x=>x.id==id):null,c=a?clients.find(x=>x.id==a.client_id):null;formTitle.textContent=a?'Επεξεργασία Ραντεβού':'Νέο Ραντεβού';editId.value=a?.id||'';clientName.value=c?.name||'';phone.value=c?.phone||'';date.value=a?.date||iso(sel);time.value=a?.time||'';service.value=a?.service||"60' Massage";location.value=a?.location||"Κατ' οίκον";price.value=a?.price||'';payment.value=a?.payment||'Μετρητά';notes.value=a?.notes||'';modal.classList.add('show')}
function closeForm(){modal.classList.remove('show')}
async function saveAppointment(){let nm=clientName.value.trim();if(!nm||!date.value||!time.value)return alert('Συμπλήρωσε όνομα, ημερομηνία και ώρα.');let cid=editId.value?appointments.find(a=>a.id==editId.value)?.client_id:null;if(!cid){let q=await sb.from('clients').select('id').eq('name',nm).maybeSingle();cid=q.data?.id||null}if(!cid){let ins=await sb.from('clients').insert({user_id:session.user.id,name:nm,phone:phone.value.trim()}).select().single();if(ins.error)return alert(ins.error.message);cid=ins.data.id}else await sb.from('clients').update({name:nm,phone:phone.value.trim()}).eq('id',cid);let payload={user_id:session.user.id,client_id:cid,date:date.value,time:time.value,service:service.value,duration_minutes:parseInt(service.value)||60,location:location.value,price:Number(price.value||0),payment:payment.value,notes:notes.value.trim()};let r;if(editId.value)r=await sb.from('appointments').update(payload).eq('id',editId.value);else r=await sb.from('appointments').insert(payload);if(r.error)return alert(r.error.message);closeForm();await loadCloud()}
async function toggleDone(id){let a=appointments.find(x=>x.id==id),status=a.status=='completed'?'scheduled':'completed';let r=await sb.from('appointments').update({status}).eq('id',id);if(r.error)return alert(r.error.message);await loadCloud()}
async function deleteAppointment(id){if(!confirm('Να διαγραφεί το ραντεβού;'))return;let r=await sb.from('appointments').delete().eq('id',id);if(r.error)return alert(r.error.message);await loadCloud()}
function showHistory(id){const c=clients.find(x=>x.id==id);const hist=appointments.filter(a=>a.client_id==id).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));document.getElementById('historyTitle').textContent=c?c.name:'Ιστορικό πελάτη';let body='<div class="meta">'+esc(c&&c.phone?c.phone:'Χωρίς τηλέφωνο')+'</div>';if(hist.length){body+=hist.map(function(a){return '<div class="card '+(a.status=='completed'?'done':'')+'"><div>'+a.date.slice(8)+'<br>'+a.time+'</div><div class="body"><div class="name">'+esc(a.service)+'</div><div class="meta">'+esc(a.location||'')+' · '+(a.status=='completed'?'Ολοκληρώθηκε':'Προγραμματισμένο')+'</div></div><div class="price">'+Number(a.price||0).toFixed(2)+'€</div></div>';}).join('')}else{body+='<div class="empty">Δεν υπάρχει ιστορικό.</div>'}document.getElementById('historyContent').innerHTML=body;document.getElementById('historyModal').classList.add('show')}
function closeHistory(){historyModal.classList.remove('show')}
sb.auth.getSession();
</script></body></html>
