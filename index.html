<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><title>Theodora's Healing Hands</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f2f0;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.page{max-width:620px;min-height:100vh;margin:auto;background:#fff}.login{padding:24px}.box{margin:10vh auto 0;padding:25px;border:1px solid #ddd;border-radius:20px;background:#fff;box-shadow:0 8px 30px #0000000d}.brand{font:28px Georgia,serif}.muted{color:#777;line-height:1.5}.label{display:block;font-size:11px;font-weight:800;margin:12px 0 5px}.input{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font-size:16px}.btn{width:100%;padding:14px;border:0;border-radius:11px;background:#111;color:#fff;font-weight:800;margin-top:14px}.msg{font-size:13px;color:#666;margin-top:12px;min-height:20px}.head{background:#111;color:#fff;padding:24px 18px}.tabs{display:flex;gap:7px;padding:12px}.tabs button{flex:1;border:0;border-radius:11px;padding:10px;background:#eee;font-weight:800}.tabs .on{background:#111;color:#fff}.bar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 14px}.bar h2{font:21px Georgia,serif;margin:0}.nav{width:40px;height:40px;border:0;border-radius:10px;background:#eee;font-size:22px}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week{font-size:10px;color:#777;text-align:center}.grid{padding:0 14px}.day{height:52px;border:1px solid #ddd;border-radius:10px;padding:7px;position:relative;background:#fff}.sel{background:#111;color:#fff}.today{border:2px solid #111}.dot{position:absolute;bottom:5px;left:50%;width:5px;height:5px;border-radius:50%;background:#111;transform:translateX(-50%)}.sel .dot{background:#fff}.section{padding:15px 16px}.section h3{font:18px Georgia,serif;margin:6px 0 12px}.card,.client{border:1px solid #ddd;border-radius:14px;padding:12px;margin:8px 0}.card{display:flex;gap:10px}.body{flex:1}.name{font-weight:800}.meta{font-size:12px;color:#777;margin-top:4px;line-height:1.4}.price{font-weight:800;white-space:nowrap}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.small{border:0;border-radius:8px;padding:7px 9px;background:#eee;font-size:11px}.done{opacity:.5}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}.stat{background:#f5f5f3;border-radius:13px;padding:13px}.stat span{font-size:11px;color:#777}.stat b{display:block;font-size:22px;margin-top:4px}.empty{text-align:center;color:#999;padding:25px}.fab{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(580px,calc(100% - 28px));padding:15px;border:0;border-radius:15px;background:#111;color:#fff;font-weight:800}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;z-index:10}.show{display:flex}.sheet{width:100%;max-width:620px;margin:auto;background:#fff;border-radius:21px 21px 0 0;padding:18px;max-height:94vh;overflow:auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btns{display:flex;gap:8px;margin-top:15px}.btns button{flex:1;padding:13px;border:0;border-radius:11px;font-weight:800}.secondary{background:#eee}.primary{background:#111;color:#fff}
</style></head><body><div id="root" class="page">
<div class="login"><div class="box"><div class="brand">Theodora's Healing Hands</div><p class="muted">Σύνδεση στην online εφαρμογή ραντεβού και πελατολογίου.</p>
<label class="label" for="email">Email</label><input class="input" id="email" type="email" autocomplete="email">
<label class="label" for="password">Κωδικός</label><input class="input" id="password" type="password" autocomplete="current-password">
<button class="btn" id="loginBtn">Σύνδεση</button><div id="loginMsg" class="msg"></div></div></div></div>
<script>
const SUPA='https://sqwvyudsnsnkdvijqlbz.supabase.co',APIKEY='sb_publishable_dvB6YzXNN3_h2bPzilxKiA_Ww-q_Nor';
let accessToken='',userId='',appointments=[],clients=[],cursor=new Date(),selected=new Date();

function setMsg(t){document.getElementById('loginMsg').textContent=t}
function jwtSub(token){try{return JSON.parse(atob(token.split('.')[1])).sub}catch{return ''}}
async function authLogin(){
 const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;
 if(!email||!password){setMsg('Συμπλήρωσε email και κωδικό.');return}
 setMsg('Σύνδεση...');document.getElementById('loginBtn').disabled=true;
 try{
  const r=await fetch(SUPA+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':APIKEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||j.message||'Η σύνδεση απέτυχε.');
  accessToken=j.access_token;userId=jwtSub(accessToken);
  localStorage.setItem('thh_access',accessToken);localStorage.setItem('thh_refresh',j.refresh_token||'');
  await loadData();
 }catch(e){setMsg(e.message)}finally{document.getElementById('loginBtn').disabled=false}
}
document.getElementById('loginBtn').addEventListener('click',authLogin);

async function api(path,options={}){
 options.headers=Object.assign({'apikey':APIKEY,'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},options.headers||{});
 const r=await fetch(SUPA+path,options);const text=await r.text();let j;try{j=JSON.parse(text)}catch{j=text}
 if(!r.ok)throw new Error(j.message||j.hint||j.msg||'Σφάλμα βάσης');return j;
}
async function loadData(){
 const [cr,ar]=await Promise.all([api('/rest/v1/clients?select=*&order=name'),api('/rest/v1/appointments?select=*&order=date,time')]);
 clients=cr||[];appointments=ar||[];renderApp();
}
function renderApp(){
 document.getElementById('root').innerHTML='<div class="head"><div class="brand" style="color:#fff">Theodora\'s Healing Hands</div><div style="font-size:11px;opacity:.7">Ημερολόγιο • Πελάτες • Έσοδα</div></div><div class="tabs"><button id="calBtn" class="on">Ημερολόγιο</button><button id="clientsBtn">Πελάτες</button><button id="incomeBtn">Έσοδα</button></div><div id="content"></div><button id="fab" class="fab">＋ Νέο Ραντεβού</button><div id="modal" class="modal"></div>';
 document.getElementById('calBtn').onclick=()=>showTab('cal');document.getElementById('clientsBtn').onclick=()=>showTab('clients');document.getElementById('incomeBtn').onclick=()=>showTab('income');document.getElementById('fab').onclick=()=>openForm();showTab('cal');
}
function showTab(v){document.getElementById('calBtn').classList.toggle('on',v==='cal');document.getElementById('clientsBtn').classList.toggle('on',v==='clients');document.getElementById('incomeBtn').classList.toggle('on',v==='income');if(v==='cal')calendar();if(v==='clients')renderClients();if(v==='income')renderIncome()}
function calendar(){
 let first=new Date(cursor.getFullYear(),cursor.getMonth(),1),start=(first.getDay()+6)%7,days=new Date(cursor.getFullYear(),cursor.getMonth()+1,0).getDate(),h='<div class="bar"><button class="nav" id="prev">‹</button><h2>'+['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'][cursor.getMonth()]+' '+cursor.getFullYear()+'</h2><button class="nav" id="next">›</button></div><div class="week"><span>ΔΕ</span><span>ΤΡ</span><span>ΤΕ</span><span>ΠΕ</span><span>ΠΑ</span><span>ΣΑ</span><span>ΚΥ</span></div><div class="grid">';
 for(let i=0;i<start;i++)h+='<div></div>';
 for(let d=1;d<=days;d++){let k=cursor.getFullYear()+'-'+String(cursor.getMonth()+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),c=k===iso(selected)?'day sel':'day';h+='<div class="'+c+'" data-day="'+d+'">'+d+(appointments.some(a=>a.date===k&&a.status!=='cancelled')?'<i class="dot"></i>':'')+'</div>'}
 h+='</div><div class="section"><h3>'+selected.toLocaleDateString('el-GR',{weekday:'long',day:'numeric',month:'long'})+'</h3>';
 const arr=appointments.filter(a=>a.date===iso(selected)).sort((a,b)=>a.time.localeCompare(b.time));h+=arr.length?arr.map(card).join(''):'<div class="empty">Δεν υπάρχουν ραντεβού.</div>';document.getElementById('content').innerHTML=h+'</div>';
 document.getElementById('prev').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);selected=new Date(cursor);calendar()};document.getElementById('next').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);selected=new Date(cursor);calendar()};
 document.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{selected=new Date(cursor.getFullYear(),cursor.getMonth(),Number(el.dataset.day));calendar()});
}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function card(a){const c=clients.find(x=>x.id===a.client_id);return '<div class="card '+(a.status==='completed'?'done':'')+'"><div><b>'+a.time+'</b></div><div class="body"><div class="name">'+esc(c?.name||'Πελάτης')+'</div><div class="meta">'+esc(a.service||'')+' · '+esc(a.location||'')+' · '+esc(a.payment||'')+'</div><div class="actions"><button class="small" onclick="openForm(\''+a.id+'\')">Επεξεργασία</button><button class="small" onclick="toggleDone(\''+a.id+'\')">'+(a.status==='completed'?'↩ Ανοιχτό':'✓ Ολοκληρώθηκε')+'</button><button class="small" onclick="removeAppt(\''+a.id+'\')">Διαγραφή</button></div></div><div class="price">'+Number(a.price||0).toFixed(2)+'€</div></div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function renderClients(){
 const content=document.getElementById('content');
 content.innerHTML='<div class="section"><h3>Πελατολόγιο</h3><input id="search" class="input" placeholder="Αναζήτηση ονόματος ή τηλεφώνου..."></div><div id="clientRows"></div>';
 const search=document.getElementById('search');
 const rows=document.getElementById('clientRows');
 function draw(){
  const needle=(search.value||'').toLowerCase().trim();
  const arr=clients.filter(function(c){return (c.name||'').toLowerCase().includes(needle)||(c.phone||'').includes(needle)});
  rows.innerHTML='';
  if(!arr.length){rows.innerHTML='<div class="empty">Δεν βρέθηκαν πελάτες.</div>';return}
  arr.forEach(function(c){
   const hist=appointments.filter(function(x){return x.client_id===c.id});
   const done=hist.filter(function(x){return x.status==='completed'});
   const total=done.reduce(function(s,x){return s+Number(x.price||0)},0);
   const el=document.createElement('div');
   el.className='client';
   el.innerHTML='<div style="display:flex;justify-content:space-between;gap:10px"><div><div class="name">'+esc(c.name)+'</div><div class="meta">'+esc(c.phone||'Χωρίς τηλέφωνο')+'</div></div><div style="text-align:right"><b>'+hist.length+'</b><div class="meta">ραντεβού</div></div></div><div class="meta">Σύνολο ολοκληρωμένων: '+total.toFixed(2)+'€</div><div style="margin-top:10px"><button class="small profileBtn">Προβολή καρτέλας & ιστορικού</button></div>';
   el.querySelector('.profileBtn').onclick=function(){showClient(c.id)};
   rows.appendChild(el);
  });
 }
 search.oninput=draw;
 draw();
}function showClient(id){
 const c=clients.find(x=>x.id===id);
 if(!c){alert('Δεν βρέθηκε ο πελάτης.');return}
 const hist=appointments.filter(x=>x.client_id===id).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
 const done=hist.filter(x=>x.status==='completed');
 const total=done.reduce((s,x)=>s+Number(x.price||0),0);
 const m=document.getElementById('modal');
 m.innerHTML='<div class="sheet"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><h2 style="margin:0 0 6px">'+esc(c.name)+'</h2><div class="meta">'+esc(c.phone||'Χωρίς τηλέφωνο')+'</div></div><button class="small" id="clientClose">Κλείσιμο</button></div><div class="stats" style="padding:15px 0 8px"><div class="stat"><span>Ολοκληρωμένα</span><b>'+done.length+'</b></div><div class="stat"><span>Έσοδα</span><b>'+total.toFixed(2)+'€</b></div></div><div class="section" style="padding:8px 0"><h3>Ιστορικό ραντεβού</h3>'+(hist.length?hist.map(function(a){return '<div class="card '+(a.status==='completed'?'done':'')+'"><div><b>'+esc(a.date)+'</b><br>'+esc(a.time)+'</div><div class="body"><div class="name">'+esc(a.service||'Μασάζ')+'</div><div class="meta">'+esc(a.location||'')+' · '+esc(a.payment||'')+(a.notes?' · '+esc(a.notes):'')+'</div></div><div class="price">'+Number(a.price||0).toFixed(2)+'€</div></div>'}).join(''):'<div class="empty">Δεν υπάρχει ιστορικό ραντεβού.</div>')+'</div><div class="btns"><button class="secondary" id="editClientBtn">Επεξεργασία πελάτη</button></div></div>';
 m.classList.add('show');
 document.getElementById('clientClose').onclick=()=>m.classList.remove('show');
 document.getElementById('editClientBtn').onclick=()=>editClient(id);
}
function editClient(id){
 const c=clients.find(x=>x.id===id);if(!c)return;
 const m=document.getElementById('modal');
 m.innerHTML='<div class="sheet"><h2>Επεξεργασία πελάτη</h2><label class="label">Όνομα</label><input class="input" id="ecn" value="'+esc(c.name||'')+'"><label class="label">Τηλέφωνο</label><input class="input" id="ecp" value="'+esc(c.phone||'')+'"><label class="label">Σημειώσεις</label><textarea class="input" id="ecnnote" rows="4">'+esc(c.notes||'')+'</textarea><div class="btns"><button class="secondary" id="ecclose">Άκυρο</button><button class="primary" id="ecsave">Αποθήκευση</button></div></div>';
 m.classList.add('show');
 document.getElementById('ecclose').onclick=()=>m.classList.remove('show');
 document.getElementById('ecsave').onclick=async function(){
  try{
   const name=document.getElementById('ecn').value.trim();if(!name){alert('Συμπλήρωσε όνομα.');return}
   await api('/rest/v1/clients?id=eq.'+id,{method:'PATCH',body:JSON.stringify({name,phone:document.getElementById('ecp').value.trim(),notes:document.getElementById('ecnnote').value.trim()})});
   m.classList.remove('show');await loadData();showTab('clients');
  }catch(e){alert(e.message)}
 };
}
function renderIncome(){let ym=cursor.getFullYear()+'-'+String(cursor.getMonth()+1).padStart(2,'0'),arr=appointments.filter(a=>a.date.startsWith(ym)),done=arr.filter(a=>a.status==='completed'),sum=done.reduce((s,a)=>s+Number(a.price||0),0);document.getElementById('content').innerHTML='<div class="bar"><button class="nav" id="prevI">‹</button><h2>'+ym+'</h2><button class="nav" id="nextI">›</button></div><div class="stats"><div class="stat"><span>Έσοδα</span><b>'+sum.toFixed(2)+'€</b></div><div class="stat"><span>Ολοκληρωμένα</span><b>'+done.length+'</b></div></div><div class="section">'+(arr.map(a=>'<div class="card '+(a.status==='completed'?'':'done')+'"><div>'+a.date.slice(8)+'<br>'+a.time+'</div><div class="body"><div class="name">'+esc((clients.find(c=>c.id===a.client_id)||{}).name||'Πελάτης')+'</div><div class="meta">'+esc(a.service||'')+' · '+esc(a.location||'')+'</div></div><div class="price">'+Number(a.price||0).toFixed(2)+'€</div></div>').join('')||'<div class="empty">Δεν υπάρχουν ραντεβού.</div>')+'</div>';document.getElementById('prevI').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);showTab('income')};document.getElementById('nextI').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);showTab('income')}}
function openForm(id){let a=id?appointments.find(x=>x.id===id):null,c=a?clients.find(x=>x.id===a.client_id):null;const m=document.getElementById('modal');m.innerHTML='<div class="sheet"><h2>'+(a?'Επεξεργασία':'Νέο')+' Ραντεβού</h2><label class="label">Όνομα</label><input class="input" id="fn" value="'+esc(c?.name||'')+'"><label class="label">Τηλέφωνο</label><input class="input" id="fp" value="'+esc(c?.phone||'')+'"><div class="row"><div><label class="label">Ημερομηνία</label><input class="input" id="fd" type="date" value="'+(a?.date||iso(selected))+'"></div><div><label class="label">Ώρα</label><input class="input" id="ft" type="time" value="'+(a?.time||'')+'"></div></div><div class="row"><div><label class="label">Μασάζ</label><select class="input" id="fs"><option>30 min Massage</option><option>60 min Massage</option><option>90 min Massage</option></select></div><div><label class="label">Τοποθεσία</label><select class="input" id="fl"><option>Κατ οίκον</option><option>Studio</option><option>Ξενοδοχείο</option></select></div></div><div class="row"><div><label class="label">Ποσό (€)</label><input class="input" id="fprice" type="number" step=".01"></div><div><label class="label">Πληρωμή</label><select class="input" id="fpay"><option>Μετρητά</option><option>POS</option><option>Κατάθεση</option><option>Εκκρεμεί</option></select></div></div><label class="label">Σημειώσεις</label><textarea class="input" id="fnote" rows="3"></textarea><div class="btns"><button class="secondary" id="close">Άκυρο</button><button class="primary" id="save">Αποθήκευση</button></div></div>';if(a){document.getElementById('fs').value=a.service||'60 min Massage';document.getElementById('fl').value=a.location||'Κατ οίκον';document.getElementById('fprice').value=a.price||'';document.getElementById('fpay').value=a.payment||'Μετρητά';document.getElementById('fnote').value=a.notes||''}m.classList.add('show');document.getElementById('close').onclick=()=>m.classList.remove('show');document.getElementById('save').onclick=()=>saveAppointment(id)}
async function saveAppointment(id){try{let name=document.getElementById('fn').value.trim();if(!name||!document.getElementById('fd').value||!document.getElementById('ft').value)return alert('Συμπλήρωσε όνομα, ημερομηνία και ώρα.');let c=clients.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!c){let r=await api('/rest/v1/clients',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({user_id:userId,name,phone:document.getElementById('fp').value.trim()})});c=r[0];clients.push(c)}let row={user_id:userId,client_id:c.id,date:document.getElementById('fd').value,time:document.getElementById('ft').value,service:document.getElementById('fs').value,duration_minutes:parseInt(document.getElementById('fs').value)||60,location:document.getElementById('fl').value,price:Number(document.getElementById('fprice').value||0),payment:document.getElementById('fpay').value,notes:document.getElementById('fnote').value.trim()};if(id)await api('/rest/v1/appointments?id=eq.'+id,{method:'PATCH',body:JSON.stringify(row)});else await api('/rest/v1/appointments',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(row)});document.getElementById('modal').classList.remove('show');await loadData()}catch(e){alert(e.message)}}
async function toggleDone(id){let a=appointments.find(x=>x.id===id),r=await api('/rest/v1/appointments?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:a.status==='completed'?'scheduled':'completed'})});await loadData()}
async function removeAppt(id){if(confirm('Να διαγραφεί το ραντεβού;')){await api('/rest/v1/appointments?id=eq.'+id,{method:'DELETE'});await loadData()}}
window.addEventListener('load',async function(){
 const token=localStorage.getItem('thh_access');
 if(!token)return;
 accessToken=token;
 try{
  const payload=JSON.parse(atob(token.split('.')[1]));
  userId=payload.sub||'';
  if(!userId)throw new Error('invalid session');
  await loadData();
 }catch(e){
  localStorage.removeItem('thh_access');
 }
});
function loginUI(){document.getElementById('root').innerHTML='<div class="login"><div class="box"><div class="brand">Theodora\'s Healing Hands</div><p class="muted">Σύνδεση στην online εφαρμογή ραντεβού και πελατολογίου.</p><label class="label">Email</label><input class="input" id="email" type="email" autocomplete="email"><label class="label">Κωδικός</label><input class="input" id="password" type="password" autocomplete="current-password"><button class="btn" id="loginBtn">Σύνδεση</button><div id="loginMsg" class="msg"></div></div></div>';document.getElementById('loginBtn').onclick=authLogin}
</script></body></html>
