<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>Theodora's Healing Hands</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#111}.wrap{max-width:620px;margin:auto;min-height:100vh;background:#fff}.login,.app{padding:24px}.loginBox{margin:10vh auto 0;border:1px solid #ddd;border-radius:20px;padding:25px;box-shadow:0 5px 25px #0000000d}.brand{font:28px Georgia,serif}.sub{color:#777;line-height:1.5;margin:12px 0 20px}label{font-size:11px;font-weight:800;display:block;margin:10px 0 4px}input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;background:#fff}button{border:0;border-radius:11px;padding:13px;font-weight:800}.primary{background:#111;color:#fff;width:100%;margin-top:14px}.msg{font-size:13px;color:#666;margin-top:12px}.top{background:#111;color:#fff;padding:23px 18px}.tabs{display:flex;gap:7px;padding:12px}.tabs button{flex:1;background:#eee}.tabs .on{background:#111;color:#fff}.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 14px}.bar h2{font:21px Georgia,serif;margin:0}.nav{background:#eee;width:40px}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week{text-align:center;color:#777;font-size:10px}.grid{padding:0 14px}.day{height:52px;border:1px solid #ddd;border-radius:10px;padding:7px;position:relative}.sel{background:#111;color:#fff}.dot{position:absolute;bottom:5px;left:50%;width:5px;height:5px;border-radius:50%;background:#111}.sel .dot{background:#fff}.section{padding:15px 16px}.card{border:1px solid #ddd;border-radius:14px;padding:12px;display:flex;gap:10px;margin:8px 0}.body{flex:1}.name{font-weight:800}.meta{font-size:12px;color:#777;margin-top:4px}.price{font-weight:800}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.small{background:#eee;padding:7px 9px;font-size:11px}.done{opacity:.5}.fab{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(580px,calc(100% - 28px));background:#111;color:#fff}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end}.show{display:flex}.sheet{width:100%;max-width:620px;margin:auto;background:#fff;border-radius:21px 21px 0 0;padding:18px;max-height:94vh;overflow:auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btns{display:flex;gap:8px;margin-top:14px}.btns button{flex:1}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}.stat{background:#f5f5f3;border-radius:13px;padding:13px}.stat span{font-size:11px;color:#777}.stat b{display:block;font-size:22px;margin-top:4px}.client{border:1px solid #ddd;border-radius:14px;padding:13px;margin:8px 16px}.empty{text-align:center;color:#999;padding:25px}
</style></head><body><div class="wrap" id="root"></div><script>
const U='https://sqwvyudsnsnkdvijqlbz.supabase.co',K='sb_publishable_dvB6YzXNN3_h2bPzilxKiA_Ww-q_Nor';let access='',refresh='',A=[],C=[],cur=new Date(),sel=new Date();
const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),MS=['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'],esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function api(path,opt={}){opt.headers=Object.assign({'apikey':K,'Authorization':'Bearer '+access,'Content-Type':'application/json','Prefer':'return=representation'},opt.headers||{});const r=await fetch(U+path,opt);const t=await r.text();let j;try{j=JSON.parse(t)}catch{j=t}if(!r.ok)throw new Error(j.message||j.hint||j.msg||'Σφάλμα βάσης');return j}
function login(){root.innerHTML='<div class="login"><div class="loginBox"><div class="brand">Theodora\'s Healing Hands</div><div class="sub">Σύνδεση για ασφαλή online αποθήκευση ραντεβού και πελατολογίου.</div><label>Email</label><input id="em" type="email"><label>Κωδικός</label><input id="pw" type="password"><button class="primary" onclick="doLogin()">Σύνδεση</button><div id="msg" class="msg"></div></div></div>'}
async function doLogin(){let e=document.getElementById('em').value.trim(),p=document.getElementById('pw').value,m=document.getElementById('msg');if(!e||!p){m.textContent='Συμπλήρωσε email και κωδικό.';return}m.textContent='Σύνδεση...';try{const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':K,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||j.message||'Η σύνδεση απέτυχε');access=j.access_token;refresh=j.refresh_token;localStorage.setItem('thh_access',access);localStorage.setItem('thh_refresh',refresh);await boot()}catch(x){m.textContent=x.message}}
async function boot(){try{let cr=await api('/rest/v1/clients?select=*&order=name'),ar=await api('/rest/v1/appointments?select=*&order=date,time');C=cr||[];A=ar||[];renderApp()}catch(x){root.innerHTML='<div class="login"><div class="loginBox"><div class="brand">Theodora\'s Healing Hands</div><div class="msg">Δεν ήταν δυνατή η φόρτωση των δεδομένων: '+esc(x.message)+'</div></div></div>'}}
function appShell(){return '<div class="top"><div style="font:23px Georgia,serif">Theodora\'s Healing Hands</div><div style="font-size:11px;opacity:.7;margin-top:4px">Ημερολόγιο • Πελάτες • Έσοδα</div></div><div class="tabs"><button id="bc" class="on" onclick="tab(\'cal\')">Ημερολόγιο</button><button id="bp" onclick="tab(\'cli\')">Πελάτες</button><button id="bi" onclick="tab(\'inc\')">Έσοδα</button></div><div id="view"></div><button class="fab" onclick="form()">＋ Νέο Ραντεβού</button><div id="modal" class="modal"></div>'}
function renderApp(){root.innerHTML=appShell();tab('cal')}
function tab(v){bc.classList.toggle('on',v=='cal');bp.classList.toggle('on',v=='cli');bi.classList.toggle('on',v=='inc');if(v=='cal')calendar();if(v=='cli')clients();if(v=='inc')income()}
function calendar(){let h='<div class="bar"><button class="nav" onclick="move(-1)">‹</button><h2>'+MS[cur.getMonth()]+' '+cur.getFullYear()+'</h2><button class="nav" onclick="move(1)">›</button></div><div class="week"><span>ΔΕ</span><span>ΤΡ</span><span>ΤΕ</span><span>ΠΕ</span><span>ΠΑ</span><span>ΣΑ</span><span>ΚΥ</span></div><div class="grid">';let f=new Date(cur.getFullYear(),cur.getMonth(),1),st=(f.getDay()+6)%7,n=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();for(let i=0;i<st;i++)h+='<div></div>';for(let d=1;d<=n;d++){let k=cur.getFullYear()+'-'+pad(cur.getMonth()+1)+'-'+pad(d);h+='<div class="'+(k==iso(sel)?'day sel':'day')+'" onclick="pick('+d+')">'+d+(A.some(a=>a.date==k&&a.status!='cancelled')?'<i class="dot"></i>':'')+'</div>'}h+='</div><div class="section"><h3>'+sel.toLocaleDateString('el-GR',{weekday:'long',day:'numeric',month:'long'})+'</h3>';let z=A.filter(a=>a.date==iso(sel)).sort((a,b)=>a.time.localeCompare(b.time));h+=z.length?z.map(card).join(''):'<div class="empty">Δεν υπάρχουν ραντεβού.</div>';view.innerHTML=h+'</div>'}
function card(a){let c=C.find(x=>x.id==a.client_id);return '<div class="card '+(a.status=='completed'?'done':'')+'"><div><b>'+a.time+'</b></div><div class="body"><div class="name">'+esc(c?c.name:'Πελάτης')+'</div><div class="meta">'+esc(a.service)+' · '+esc(a.location||'')+' · '+esc(a.payment||'')+'</div><div class="actions"><button class="small" onclick="form(\''+a.id+'\')">Επεξεργασία</button><button class="small" onclick="toggle(\''+a.id+'\')">'+(a.status=='completed'?'↩ Ανοιχτό':'✓ Ολοκληρώθηκε')+'</button><button class="small" onclick="delA(\''+a.id+'\')">Διαγραφή</button></div></div><div class="price">'+Number(a.price||0).toFixed(2)+'€</div></div>'}
function clients(){let q=(clientSearch?.value||'').toLowerCase();view.innerHTML='<div class="section"><input id="clientSearch" placeholder="Αναζήτηση πελάτη..." value="'+esc(q)+'" oninput="clients()"></div>'+C.filter(c=>c.name.toLowerCase().includes(q)||(c.phone||'').includes(q)).map(c=>'<div class="client"><b>'+esc(c.name)+'</b><div class="meta">'+esc(c.phone||'Χωρίς τηλέφωνο')+'</div><div class="meta">Ραντεβού: '+A.filter(a=>a.client_id==c.id).length+'</div></div>').join('')||'<div class="empty">Δεν βρέθηκαν πελάτες.</div>'}
function income(){let ym=cur.getFullYear()+'-'+pad(cur.getMonth()+1),d=A.filter(a=>a.date.startsWith(ym)&&a.status=='completed'),sum=d.reduce((s,a)=>s+Number(a.price||0),0);view.innerHTML='<div class="bar"><button class="nav" onclick="move(-1)">‹</button><h2>'+MS[cur.getMonth()]+' '+cur.getFullYear()+'</h2><button class="nav" onclick="move(1)">›</button></div><div class="stats"><div class="stat"><span>Έσοδα</span><b>'+sum.toFixed(2)+'€</b></div><div class="stat"><span>Ολοκληρωμένα</span><b>'+d.length+'</b></div></div><div class="section">'+(d.map(a=>'<div class="card"><div>'+a.date.slice(8)+'<br>'+a.time+'</div><div class="body"><b>'+esc((C.find(c=>c.id==a.client_id)||{}).name||'Πελάτης')+'</b><div class="meta">'+esc(a.service)+'</div></div><div class="price">'+Number(a.price||0).toFixed(2)+'€</div></div>').join('')||'<div class="empty">Δεν υπάρχουν ολοκληρωμένα ραντεβού.</div>')+'</div>'}
function pick(d){sel=new Date(cur.getFullYear(),cur.getMonth(),d);calendar()}function move(n){cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);sel=new Date(cur);tab('cal')}
async function form(id){let a=id?A.find(x=>x.id==id):null,c=a?C.find(x=>x.id==a.client_id):null;modal.innerHTML='<div class="sheet"><h2>'+(a?'Επεξεργασία':'Νέο')+' Ραντεβού</h2><label>Όνομα</label><input id="fn" value="'+esc(c?.name||'')+'"><label>Τηλέφωνο</label><input id="fp" value="'+esc(c?.phone||'')+'"><div class="row"><div><label>Ημερομηνία</label><input id="fd" type="date" value="'+(a?.date||iso(sel))+'"></div><div><label>Ώρα</label><input id="ft" type="time" value="'+(a?.time||'')+'"></div></div><div class="row"><div><label>Μασάζ</label><select id="fs"><option>30' Massage</option><option '+(!a||a.service=="60' Massage"?'selected':'')+'>60' Massage</option><option '+(a?.service=="90' Massage"?'selected':'')+'>90' Massage</option></select></div><div><label>Τοποθεσία</label><select id="fl"><option>Κατ' οίκον</option><option '+(a?.location=='Studio'?'selected':'')+'>Studio</option><option '+(a?.location=='Ξενοδοχείο'?'selected':'')+'>Ξενοδοχείο</option></select></div></div><div class="row"><div><label>Ποσό</label><input id="fpr" type="number" step=".01" value="'+(a?.price||'')+'"></div><div><label>Πληρωμή</label><select id="fpa"><option>Μετρητά</option><option '+(a?.payment=='POS'?'selected':'')+'>POS</option><option '+(a?.payment=='Κατάθεση'?'selected':'')+'>Κατάθεση</option><option '+(a?.payment=='Εκκρεμεί'?'selected':'')+'>Εκκρεμεί</option></select></div></div><label>Σημειώσεις</label><textarea id="fnote" rows="3">'+esc(a?.notes||'')+'</textarea><div class="btns"><button onclick="closeM()">Άκυρο</button><button class="save" onclick="saveA(\''+(a?.id||'')+'\')">Αποθήκευση</button></div></div>';modal.classList.add('show')}
function closeM(){modal.classList.remove('show')}
async function saveA(id){let name=fn.value.trim();if(!name||!fd.value||!ft.value)return alert('Συμπλήρωσε όνομα, ημερομηνία και ώρα.');let c=C.find(x=>x.name.toLowerCase()==name.toLowerCase()),cid=c?.id;if(!cid){let r=await api('/rest/v1/clients',{method:'POST',body:JSON.stringify({user_id:JSON.parse(atob(access.split('.')[1])).sub,name,phone:fp.value.trim()})});cid=r[0].id;C.push(r[0])}else{await api('/rest/v1/clients?id=eq.'+cid,{method:'PATCH',body:JSON.stringify({phone:fp.value.trim()})})}let payload={user_id:JSON.parse(atob(access.split('.')[1])).sub,client_id:cid,date:fd.value,time:ft.value,service:fs.value,duration_minutes:parseInt(fs.value)||60,location:fl.value,price:Number(fpr.value||0),payment:fpa.value,notes:fnote.value.trim()};if(id)await api('/rest/v1/appointments?id=eq.'+id,{method:'PATCH',body:JSON.stringify(payload)});else await api('/rest/v1/appointments',{method:'POST',body:JSON.stringify(payload)});closeM();await boot()}
async function toggle(id){let a=A.find(x=>x.id==id);await api('/rest/v1/appointments?id=eq.'+id,{method:'PATCH',body:JSON.stringify({status:a.status=='completed'?'scheduled':'completed'})});await boot()}async function delA(id){if(confirm('Να διαγραφεί το ραντεβού;')){await api('/rest/v1/appointments?id=eq.'+id,{method:'DELETE'});await boot()}}
(function start(){login()})();
</script></body></html>
