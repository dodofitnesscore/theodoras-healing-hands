<!doctype html><html lang="el"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theodora's Healing Hands — Δημιουργία λογαριασμού</title><style>body{margin:0;background:#f2f2f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial}.box{max-width:420px;margin:12vh auto;background:#fff;padding:28px;border-radius:20px;border:1px solid #ddd}.brand{font:28px Georgia,serif}p{color:#777;line-height:1.5}label{font-size:12px;font-weight:700;display:block;margin:12px 0 5px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:11px;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:800;margin-top:15px}.msg{margin-top:14px;font-size:13px;color:#555}</style><div class="box"><div class="brand">Theodora's Healing Hands</div><p>Δημιουργία του προσωπικού σου λογαριασμού για online αποθήκευση ραντεβού και πελατολογίου.</p><label>Email</label><input id="e" type="email" autocomplete="email"><label>Κωδικός</label><input id="p" type="password" autocomplete="new-password"><button type="button" id="b">Δημιουργία λογαριασμού</button><div id="m" class="msg"></div></div><script>
